name: Release

# release-please grooms the release pull request and tags it; the tag is then
# published to npm through trusted publishing, so there is no registry token
# stored here, and to GitHub Container Registry under the same version.
#
# The `workflow_run.event == 'push'` condition is what stops a pull request with
# green CI from cutting a release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: roquerodrigo/workflows/.github/workflows/release-please.yml@main
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_PAT }}

  publish:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: roquerodrigo/workflows/.github/workflows/publish-npm.yml@main
    with:
      ref: ${{ needs.release.outputs.tag-name }}

  publish-docker:
    name: Publish Docker image
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag-name }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag-name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag-name }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag-name }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
